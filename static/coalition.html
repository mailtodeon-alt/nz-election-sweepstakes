<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Coalition · NZ Election 2026</title>
<meta name="theme-color" content="#070b14"/>
<link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body>
<div class="wrap wide">
  <p><a id="homeLink" href="/live">← Board</a></p>
  <h1>Coalition</h1>
  <p class="muted" id="houseLabel">Loading…</p>
  <div id="blocs"></div>
  <h2>From the news</h2>
  <div id="coalNews" class="news-list"></div>
  <section id="hostNotes" hidden>
    <h2>Host notes</h2>
    <div id="events"></div>
  </section>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/house.js"></script>
<script>
if (Sweep.isDemo) document.getElementById('homeLink').href = '/demo/live';

function badge(bloc) {
  const pill = document.createElement('span');
  pill.className = 'pill ' + (bloc.majority ? 'live' : 'locked');
  pill.textContent = bloc.majority ? 'has a majority' : (bloc.short + ' short');
  return pill;
}

function drawBlocs(data) {
  const label = document.getElementById('houseLabel');
  const house = data.house || 0;
  const majority = data.majority || 0;
  const kind = data.source === 'projected'
    ? (data.provisional ? 'Projected seats' : 'Final seats')
    : 'Current House';
  label.textContent = (data.label || kind) + ' · ' + majority + ' of ' + house + ' to govern';
  const box = document.getElementById('blocs');
  box.replaceChildren();
  (data.blocs || []).forEach((bloc) => {
    const card = document.createElement('article');
    card.className = 'card coal-bloc';
    const head = document.createElement('div');
    head.className = 'coal-head';
    const title = document.createElement('strong');
    title.textContent = (bloc.names || []).join(' + ');
    const seats = document.createElement('span');
    seats.textContent = bloc.seats + ' seats';
    head.append(title, badge(bloc));
    const track = document.createElement('div');
    track.className = 'coal-track';
    track.setAttribute('role', 'img');
    track.setAttribute('aria-label', bloc.seats + ' seats, majority ' + majority);
    const fill = document.createElement('span');
    const width = house ? Math.min(100, (bloc.seats / house) * 100) : 0;
    fill.style.width = width + '%';
    const mark = document.createElement('i');
    const at = house ? Math.min(100, (majority / house) * 100) : 0;
    mark.style.left = at + '%';
    track.append(fill, mark);
    const meta = document.createElement('p');
    meta.className = 'muted';
    meta.textContent = bloc.seats + ' seats · line is ' + majority;
    card.append(head, seats, track, meta);
    box.appendChild(card);
  });
}

function drawNews(items) {
  const box = document.getElementById('coalNews');
  box.replaceChildren();
  if (!(items || []).length) {
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = 'No coalition headlines in the feeds yet.';
    box.appendChild(p);
    return;
  }
  items.forEach((item) => {
    const a = document.createElement('a');
    a.className = 'headline';
    a.href = item.url || '#';
    a.target = '_blank';
    a.rel = 'noopener';
    const title = document.createElement('strong');
    title.textContent = item.title || '';
    const small = document.createElement('small');
    small.textContent = [item.source, House.ago(item.published)].filter(Boolean).join(' · ');
    a.append(title, small);
    box.appendChild(a);
  });
}

function drawNotes(events) {
  const section = document.getElementById('hostNotes');
  const box = document.getElementById('events');
  box.replaceChildren();
  if (!(events || []).length) {
    section.hidden = true;
    return;
  }
  section.hidden = false;
  events.forEach((ev) => {
    const card = document.createElement('article');
    card.className = 'card';
    const when = document.createElement('div');
    when.className = 'muted';
    when.textContent = Sweep.formatWhen(ev.at) || '';
    const title = document.createElement('h3');
    title.textContent = ev.headline || '';
    card.append(when, title);
    if (ev.parties) {
      const tags = document.createElement('p');
      tags.textContent = ev.parties;
      card.appendChild(tags);
    }
    if (ev.source_url) {
      const link = document.createElement('a');
      link.href = ev.source_url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Source';
      card.appendChild(link);
    }
    box.appendChild(card);
  });
}

function draw(data) {
  drawBlocs(data || {});
  drawNews(data && data.news);
  drawNotes(data && data.events);
}
function load() { Sweep.api('/api/coalition').then(draw).catch(() => {}); }
load();
Sweep.subscribe((msg) => { if (msg.event !== 'heartbeat' && msg.event !== 'reactions') load(); });
</script>
</body></html>
