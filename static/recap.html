<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recap · NZ Election 2026</title>
<meta name="theme-color" content="#070b14"/>
<link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body>
<div class="wrap">
  <p><a id="homeLink" href="/">← Board</a> · <a id="pngLink" href="/recap.png">Download PNG</a></p>
  <div id="houseMount"></div>
  <article class="recap-card" id="card">
    <p class="muted" id="kicker">Loading…</p>
    <h1 id="leader">—</h1>
    <p id="total"></p>
    <div id="top"></div>
    <p id="best"></p>
    <p id="worst"></p>
    <p id="mover"></p>
    <p class="muted" id="when"></p>
  </article>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/house.js"></script>
<script>
const publicRecap = location.pathname.includes('/open/recap') || location.pathname.endsWith('/open/recap');
const pool = publicRecap ? 'public' : 'pot';
if (Sweep.isDemo) {
  document.getElementById('homeLink').href = publicRecap ? '/demo/open/live' : '/demo/live';
  document.getElementById('pngLink').href = (publicRecap ? '/open/recap.png' : '/recap.png') + '?demo=1';
} else if (publicRecap) {
  document.getElementById('homeLink').href = '/open/live';
  document.getElementById('pngLink').href = '/open/recap.png';
}
function mountHouse(view) {
  if (!view) return;
  House.mount(document.getElementById('houseMount'), {
    has_results: !!view.projected,
    current: view,
    live: view.projected ? view : null,
  }, { compact: true });
}
function paint(card) {
  mountHouse(card.parliament);
  const leader = document.getElementById('leader');
  const bits = ['total', 'top', 'best', 'worst', 'mover', 'when'];
  if (card.awaiting) {
    document.getElementById('kicker').textContent = 'Recap';
    leader.hidden = true;
    leader.textContent = '';
    bits.forEach((id) => {
      const el = document.getElementById(id);
      el.hidden = true;
      el.replaceChildren();
    });
    let msg = document.getElementById('recapEmpty');
    if (!msg) {
      msg = document.createElement('p');
      msg.id = 'recapEmpty';
      msg.className = 'recap-empty';
      document.getElementById('card').appendChild(msg);
    }
    msg.hidden = false;
    msg.textContent = card.message || 'No results yet, recap fills in once counting starts';
    return;
  }
  const empty = document.getElementById('recapEmpty');
  if (empty) empty.hidden = true;
  leader.hidden = false;
  bits.forEach((id) => { document.getElementById(id).hidden = false; });
  document.getElementById('kicker').textContent = card.title || 'Recap';
  leader.textContent = card.leader || '—';
  document.getElementById('total').textContent = (card.leader_total == null ? '—' : card.leader_total) + ' pts';
  const top = document.getElementById('top');
  top.replaceChildren();
  (card.top || []).forEach((row) => {
    const line = document.createElement('div');
    line.textContent = (row.place_label || row.place) + '  ' + (row.name || '') + ' · ' + row.total;
    top.appendChild(line);
  });
  document.getElementById('best').textContent = 'Best call: ' + (card.best_call || '—');
  document.getElementById('worst').textContent = 'Worst call: ' + (card.worst_call || '—');
  const m = card.biggest_mover;
  document.getElementById('mover').textContent = m ? ('Biggest mover: ' + m.name + ' ' + m.from_place + ' → ' + m.to_place) : 'Biggest mover: —';
  document.getElementById('when').textContent = Sweep.formatWhen(card.at) || '';
}
function load() {
  Sweep.api('/api/recap?pool=' + pool).then(paint).catch(() => {});
}
load();
Sweep.subscribe((msg) => { if (msg.event !== 'heartbeat' && msg.event !== 'reactions') load(); });
</script>
</body></html>
