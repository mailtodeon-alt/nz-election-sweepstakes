# Render Blueprint — NZ Election Night Sweepstakes 2026
# Free web service + free Postgres (Singapore = closest to NZ).
# Do NOT enable auth gateways; friends need public access with no Microsoft login.
services:
  - type: web
    name: election-sweepstakes
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gthread --threads 16 -w 1 --timeout 0 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: election-sweepstakes-db
          property: connectionString

databases:
  - name: election-sweepstakes-db
    plan: free
    region: singapore
